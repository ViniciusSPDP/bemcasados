# Ambiente de desenvolvimento local.
#
# As credenciais saíram do arquivo: elas ficavam versionadas e o usuário do
# MinIO era o mesmo nome do host de produção. Agora vêm de um .env local, que
# está no .gitignore. Copie o .env.example e preencha antes de subir.
services:
  db:
    image: postgres:17-alpine # alinhado com a versão usada em produção
    container_name: bem_casados_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bem_casados_db}
    ports:
      # Só na interface local — sem o 127.0.0.1 o Docker publica na rede toda
      # e fura o firewall do host.
      #
      # A porta é parametrizável porque é comum ter outro projeto ocupando a
      # padrão. Se mudar aqui, ajuste a porta na DATABASE_URL do .env também.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z-cpuv1
    container_name: bem_casados_minio
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:${MINIO_PORT:-9002}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio_data:/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bem_casados_redis
    restart: always
    # `--save ""` desliga a persistência: são contadores de rate limit, perder
    # tudo num restart é aceitável e evita gravar chave de IP em disco.
    command: redis-server --save "" --appendonly no
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

volumes:
  db_data:
  minio_data:
