services:
  db:
    image: postgres:15-alpine
    container_name: bem_casados_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bem_casados_db
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z-cpuv1
    container_name: bem_casados_minio
    command: server /data --console-address ":9001"
    ports:
      - '9002:9000'
      - '9003:9001'
    environment:
      MINIO_ROOT_USER: "s4r41va"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  db_data:
  minio_data: