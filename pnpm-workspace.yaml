# Versões forçadas em dependências transitivas.
#
# lodash: o `prisma` traz `@prisma/studio-core` -> visx -> lodash 4.17.21, que
# tem code injection via `_.template` (GHSA-r5fr-rjxr-66jc). O código nunca é
# carregado pela aplicação, mas mantém a auditoria suja e mascararia um
# problema real no futuro.
overrides:
  lodash: '^4.17.24'

# Allowlist explícita de pacotes autorizados a rodar scripts de instalação.
# Qualquer dependência nova que peça postinstall precisa ser aprovada aqui
# conscientemente — é a barreira contra supply chain via script de build.
allowBuilds:
  '@prisma/engines': true # baixa os engines do Prisma
  esbuild: true # binário do bundler
  prisma: true # CLI do Prisma (generate/migrate)
  unrs-resolver: true # resolver nativo do eslint-config-next
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1000.26'
  - '@aws-sdk/client-s3@3.1103.0'
  - '@aws-sdk/core@3.977.6'
  - '@aws-sdk/credential-provider-env@3.972.67'
  - '@aws-sdk/credential-provider-http@3.972.69'
  - '@aws-sdk/credential-provider-ini@3.973.12'
  - '@aws-sdk/credential-provider-login@3.972.74'
  - '@aws-sdk/credential-provider-node@3.972.78'
  - '@aws-sdk/credential-provider-process@3.972.67'
  - '@aws-sdk/credential-provider-sso@3.973.11'
  - '@aws-sdk/credential-provider-web-identity@3.972.73'
  - '@aws-sdk/middleware-sdk-s3@3.972.72'
  - '@aws-sdk/nested-clients@3.997.41'
  - '@aws-sdk/s3-request-presigner@3.1103.0'
  - '@aws-sdk/token-providers@3.1103.0'
